version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.astro
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - PUBLIC_API_URL=http://backend:8080  # Internal Docker network URL
      # Add any other frontend environment variables here
      # - TMDB_API_KEY=${TMDB_API_KEY}
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - app-network

  backend:
    build:
      context: ./content-aggregator
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TMDB_API_KEY=3e3166a2077f3e58c3efe7058f9ee
      # Add other backend environment variables here
      # - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./content-aggregator:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge